services:
  secrets-init:
    image: alpine:3.24
    command:
      - sh
      - -ec
      - |
        if [ ! -s /s/db_password ]; then
          head -c 32 /dev/urandom | base64 | tr -d '/+=\n' > /s/db_password.tmp
          chmod 444 /s/db_password.tmp
          mv /s/db_password.tmp /s/db_password
        fi
    volumes:
      - secrets:/s
    restart: "no"

  db:
    build: ./db
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - secrets:/run/secrets:ro
      - pgdata:/var/lib/postgresql
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    stop_grace_period: 40s
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  app2:
    profiles: [replicas]
    build: .
    stop_grace_period: 40s
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  proxy:
    profiles: [replicas]
    image: caddy:2.10.0-alpine
    command: ["caddy", "reverse-proxy", "--from", ":8081", "--to", "app:8080", "--to", "app2:8080"]
    ports:
      - "${PROXY_PORT:-8081}:8081"
    depends_on:
      - app
      - app2

volumes:
  secrets:
  pgdata:
