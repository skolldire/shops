http:
  addr: ${HTTP_ADDR:-:8080}
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 25s
  public_origins: []
metrics:
  addr: ${METRICS_ADDR:-:9100}
health:
  timeout: 2s
database:
  host: ${DB_HOST:-db}
  port: ${DB_PORT:-5432}
  name: shop
  user: shop
  password: ${file:/run/secrets/db_password}
  ssl_mode: disable
  max_conns: 10
  connect_timeout: 5s
log:
  level: ${LOG_LEVEL:-info}
telemetry:
  service_name: shops
  service_version: ${APP_VERSION:-dev}
  tracing:
    enabled: ${TRACING_ENABLED:-false}
    endpoint: ${OTLP_ENDPOINT:-}
    insecure: ${OTLP_INSECURE:-false}
    sampling_rate: 1
import:
  max_bytes: 10485760
  max_rows: 10000
demo:
  seed: ${SEED_DEMO:-true}
  seed_file: ${SEED_FILE:-/etc/shop/seed.csv}
  users: [alice, bob, carol]
checkout:
  reserve_timeout: 3s
  charge_timeout: 6s
  finalize_timeout: 3s
  max_pending_age: 30m
recovery:
  interval: 10s
  batch_size: 20
  min_age: 30s
  lease: 30s
  db_timeout: 2s
  base_backoff: 5s
  max_backoff: 5m
  stuck_after_attempts: 10
