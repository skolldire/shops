http:
  addr: ${HTTP_ADDR:-127.0.0.1:8080}
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
metrics:
  addr: ${METRICS_ADDR:-127.0.0.1:9100}
health:
  timeout: 2s
database:
  host: ${DB_HOST:-127.0.0.1}
  port: ${DB_PORT:-5432}
  name: shop
  user: shop
  password: ${DB_PASSWORD}
  ssl_mode: disable
  max_conns: 10
  connect_timeout: 5s
log:
  level: ${LOG_LEVEL:-debug}
telemetry:
  service_name: shops
  service_version: ${APP_VERSION:-dev}
  tracing:
    enabled: ${TRACING_ENABLED:-false}
    endpoint: ${OTLP_ENDPOINT:-}
    insecure: ${OTLP_INSECURE:-false}
    sampling_rate: 1
import:
  max_bytes: 10485760
  max_rows: 10000
demo:
  seed: ${SEED_DEMO:-true}
