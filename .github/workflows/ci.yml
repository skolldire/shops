name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  lint:
    name: Lint and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m ./...
      - name: No comments in code and config
        run: make lint-comments
      - name: Module boundaries
        run: make lint-arch
      - name: Decimals are parsed with the shared parser
        run: make lint-decimals
      - name: go.mod and go.sum are tidy
        run: make tidy-check
      - name: Dockerfile style
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true

  test:
    name: Unit tests (Go ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          check-latest: true
      - name: Test with race detector and coverage
        run: make coverage
      - name: Upload coverage
        if: matrix.name == 'go.mod'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: ./.github/actions/docker-hub-mirror
      - name: Test against PostgreSQL with testcontainers
        run: make test-integration

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go.mod and the Dockerfile use the same Go release
        run: |
          set -eu
          version="$(awk '$1 == "go" {print $2}' go.mod)"
          test "$(go env GOVERSION)" = "go${version}"
          grep -Fxq "FROM golang:${version}-alpine AS build" Dockerfile
      - name: govulncheck
        run: make vuln GOVULNCHECK_VERSION=${{ env.GOVULNCHECK_VERSION }}

  container:
    name: Image scan and end-to-end smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: shops
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
      - name: Pull service images
        run: docker compose --profile replicas -f compose.yaml -f compose.debug.yaml pull --ignore-buildable --policy always
      - name: Build images
        id: build
        run: |
          mkdir -p trivy-reports
          docker compose --profile replicas -f compose.yaml -f compose.debug.yaml build --pull
      - name: Scan image (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shops-app:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m
          output: trivy-reports/app.txt
      - name: Scan remaining service images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile replicas -f compose.yaml -f compose.debug.yaml config --images > trivy-reports/images.txt
          sort -u trivy-reports/images.txt > trivy-reports/unique-images.txt
          status=0
          while IFS= read -r image; do
            case "$image" in shops-app|shops-app:latest) continue ;; esac
            report="$(printf '%s' "$image" | tr '/:' '__')"
            if ! trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --timeout 10m "$image" 2>&1 | tee "trivy-reports/${report}.txt"; then
              status=1
            fi
          done < trivy-reports/unique-images.txt
          exit "$status"
      - name: Show application image report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cat trivy-reports/app.txt
      - name: Upload image vulnerability reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: image-vulnerability-reports
          path: trivy-reports/
          retention-days: 14
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -eu
          ready="$(curl -fsS localhost:8080/health/ready)"
          test "$ready" = '{"status":"up","checks":{"postgres":"up"}}'
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' localhost:8080/api/v1/no-existe)" = "404 application/problem+json"
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' localhost:8080/no-existe)" = "404 text/html; charset=utf-8"
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' localhost:8080/)" = "200 text/html; charset=utf-8"
          test "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' localhost:8080/api/v1/products)" = "200 application/json"
          curl -s -D - -o /dev/null -X DELETE localhost:8080/health/live | grep -qi '^allow: GET'
          tables="$(docker compose exec -T db psql -U shop -d shop -tAc "select string_agg(table_name, ',' order by table_name collate \"C\") from information_schema.tables where table_schema = 'public'")"
          test "$tables" = "cart_items,imports,inbox,inventory_movements,outbox,payment_fake_charges,product_sales,products,purchase_items,purchases" || { echo "unexpected tables: $tables"; exit 1; }
          password="$(docker compose exec -T db cat /run/secrets/db_password)"
          if docker inspect shops-app-1 | grep -qF "$password"; then echo "password found in docker inspect"; exit 1; fi
          if docker compose logs app | grep -qF "$password"; then echo "password found in logs"; exit 1; fi
      - name: Graceful shutdown
        run: |
          set -eu
          timeout 15 docker compose stop app
          docker compose logs app | grep -q '"message":"shutdown complete"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  dependency-review:
    name: Dependency review (OSV-Scanner)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      fail-on-vuln: true
      scan-args: |-
        --no-call-analysis=go
        -r
        ./
