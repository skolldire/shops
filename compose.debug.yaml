services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  app:
    ports:
      - "127.0.0.1:${METRICS_PORT:-9100}:9100"

  prometheus:
    build: ./deploy/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_healthy
